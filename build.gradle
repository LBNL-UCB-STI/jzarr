group 'com.github.LBNL-UCB-STI'
version 'v0.4.10'

apply plugin: 'java'
apply plugin: 'maven-publish'

ext {
    netcdfJavaVersion = '5.8.0'
    slf4jVersion = '1.7.25'
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}


repositories {
    mavenCentral()
    maven {
        url 'https://artifacts.unidata.ucar.edu/repository/unidata-all/'
    }
    maven {
        url 'https://jitpack.io'
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.7.1'
    implementation 'org.lasersonlab:jblosc:1.0.1'
    implementation "edu.ucar:cdm-core:${netcdfJavaVersion}"
    implementation "edu.ucar:netcdf4:${netcdfJavaVersion}"
    implementation group: 'org.lasersonlab', name: 'jblosc', version: '1.0.1'
    runtimeOnly "org.slf4j:slf4j-jdk14:${slf4jVersion}"
    testImplementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'org.hamcrest:hamcrest-all:1.3'
    testImplementation 'junit:junit:4.13.1'
    testImplementation 'com.google.jimfs:jimfs:1.1'
    testImplementation 'org.nd4j:nd4j-api:1.0.0-beta4'
    testImplementation 'org.assertj:assertj-core:3.19.0'
    testImplementation 'org.lasersonlab:s3fs:2.2.3'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId group
            artifactId 'jzarr'
            version version
            artifact(tasks.jar)
            pom.withXml {
                def root = asNode()
                root.appendNode('packaging', 'jar')
                def licensesNode = root.appendNode('licenses')
                def licenseNode = licensesNode.appendNode('license')
                licenseNode.appendNode('name', 'The Apache Software License, Version 2.0')
                licenseNode.appendNode('url', 'https://www.apache.org/licenses/LICENSE-2.0.txt')
                licenseNode.appendNode('distribution', 'repo')

                def scmNode = root.appendNode('scm')
                scmNode.appendNode('connection', 'scm:git:git://github.com/LBNL-UCB-STI/jzarr.git')
                scmNode.appendNode('developerConnection', 'scm:git:ssh://github.com/LBNL-UCB-STI/jzarr.git')
                scmNode.appendNode('url', 'https://github.com/LBNL-UCB-STI/jzarr')
            }
            artifact tasks.named('sourcesJar')
            artifact tasks.named('javadocJar')
        }
    }
}
//scm {
//    url "https://github.com/LBNL-UCB-STI/jzarr"
//}

artifacts {
    archives sourcesJar
    archives javadocJar
}